<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chess — Test Suite</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1b1d22; color: #e7e9ee; line-height: 1.5;
    }
    a { color: #6ea8fe; }
    h1 { margin: 0 0 0.25rem; }
    .lead { color: #aab0bd; margin-top: 0; }
    .summary {
      font-size: 1.25rem; font-weight: 700; padding: 0.8rem 1rem; border-radius: 10px;
      margin: 1rem 0; border: 2px solid #3a3f4b; background: #24272e;
    }
    .summary.all-pass { border-color: #57c08a; background: rgba(87, 192, 138, 0.12); color: #9be7c0; }
    .summary.has-fail { border-color: #e5616b; background: rgba(229, 97, 107, 0.12); color: #f3a3a8; }
    .group { margin-bottom: 1.25rem; }
    .group h2 { font-size: 1rem; color: #aab0bd; border-bottom: 1px solid #3a3f4b; padding-bottom: 0.3rem; }
    .case { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.2rem 0; flex-wrap: wrap; }
    .badge {
      font-size: 0.72rem; font-weight: 700; padding: 0.1rem 0.45rem; border-radius: 5px; min-width: 3rem; text-align: center;
    }
    .case.pass .badge { background: #1f3c2e; color: #7fdcab; }
    .case.fail .badge { background: #46232a; color: #f3a3a8; }
    .case-name { flex: 1 1 auto; }
    .err {
      flex-basis: 100%; margin: 0.25rem 0 0.5rem 3.5rem; padding: 0.5rem 0.75rem;
      background: #2c1d20; color: #f3a3a8; border-radius: 6px; white-space: pre-wrap; font-size: 0.85rem;
    }
    .running { color: #aab0bd; }
    .back { display: inline-block; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Back to game</a>
  <h1>Claude Chess — Test Suite</h1>
  <p class="lead">Hand-written chess rules, draw logic, FEN/SAN/PGN, and AI legality — verified in your browser. No external test libraries.</p>

  <div id="summary" class="summary running">Running tests…</div>
  <div id="results"></div>

  <!-- Load the same engine + AI the game uses, then the tests. -->
  <script src="chess.js"></script>
  <script src="ai.js"></script>
  <script src="test.js"></script>
</body>
</html>
